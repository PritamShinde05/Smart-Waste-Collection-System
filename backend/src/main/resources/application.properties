server.port=${SERVER_PORT:8080}

# MySQL 8 Database Configuration (smart_waste_db)
# Supply DB_USERNAME and DB_PASSWORD via environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_waste_db}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Migrations + Hibernate Schema Validation
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (must be provided via JWT_SECRET env var, >= 32 UTF-8 bytes)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS allowed origins (Vite React frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# OSRM Routing Service
app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.osrm.max-waypoints=${OSRM_MAX_WAYPOINTS:50}
app.osrm.timeout-seconds=${OSRM_TIMEOUT_SECONDS:12}

# MySQL Backup Directory & Retention
app.backup.dir=${DB_BACKUP_DIR:./backups}
app.backup.retention-count=${DB_BACKUP_RETENTION_COUNT:14}
app.backup.db-host=${DB_HOST:localhost}
app.backup.db-port=${DB_PORT:3306}
app.backup.db-name=${DB_NAME:smart_waste_db}
app.backup.db-username=${DB_USERNAME:root}
app.backup.db-password=${DB_PASSWORD:}
