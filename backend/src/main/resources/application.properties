server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (smart_waste_db)
# Set DB_USERNAME and DB_PASSWORD environment variables before starting.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_waste_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=#Pritam05
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Configuration (set a strong >=32 char JWT_SECRET in production)
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-key-to-at-least-32-characters-in-prod}
app.jwt.expiration-ms=86400000

# CORS allowed origins (React frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# OSRM Routing Service
app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
