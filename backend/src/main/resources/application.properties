server.port=${SERVER_PORT:8080}

# MySQL Database Configuration (smart_waste_db)
# Never hardcode real credentials here; supply DB_USERNAME and DB_PASSWORD via environment variables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smart_waste_db}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Configuration (must be provided via JWT_SECRET env var, >= 32 UTF-8 bytes)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# CORS allowed origins (React frontend)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# OSRM Routing Service (set OSRM_BASE_URL to self-hosted or managed OSRM in production)
app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org}
app.osrm.max-waypoints=${OSRM_MAX_WAYPOINTS:50}
app.osrm.timeout-seconds=${OSRM_TIMEOUT_SECONDS:12}
