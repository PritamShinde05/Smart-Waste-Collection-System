spring.datasource.url=jdbc:h2:mem:verdant_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none

app.jwt.secret=test-only-signing-key-at-least-32-bytes-long-0000
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.osrm.base-url=https://router.project-osrm.org
app.osrm.max-waypoints=50
app.osrm.timeout-seconds=12
app.backup.dir=./target/test-backups
app.backup.retention-count=7
