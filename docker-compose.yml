services:
  mysql:
    image: mysql:8.0
    container_name: verdantroute-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-smart_waste_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in environment before starting}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional self-hosted OSRM routing server profile (removes public router.project-osrm.org dependency).
  # Prepare your regional .osrm map extract in ./osrm-data first, then run:
  #   docker compose --profile self-hosted-osrm up -d
  # and set OSRM_BASE_URL=http://localhost:5000
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: verdantroute-osrm
    profiles: ["self-hosted-osrm"]
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/region.osrm

volumes:
  mysql_data:
